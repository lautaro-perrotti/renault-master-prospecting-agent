services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prospecting
      POSTGRES_PASSWORD: prospecting
      POSTGRES_DB: prospecting
    ports:
      - "55432:5432"
    volumes:
      - prospecting_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospecting -d prospecting"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://prospecting:prospecting@postgres:5432/prospecting
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev
    ports:
      - "3001:3001"
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://prospecting:prospecting@postgres:5432/prospecting
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run worker
  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://prospecting:prospecting@postgres:5432/prospecting
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run scheduler
volumes:
  prospecting_pgdata:
